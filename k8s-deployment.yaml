apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-web-deployment
spec:
  replicas: 2 
  selector:
    matchLabels:
      app: my-web-app
  template:
    metadata:
      labels:
        app: my-web-app
    spec:
      containers:
      - name: web-box
        image: kel4ever/my-first-container:v1 # 🚀 CHANGED: Pointing to your live Docker Hub image!
        imagePullPolicy: Always                 # 🚀 CHANGED: Telling K8s to pull it down from the cloud registry!
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: my-web-service
spec:
  type: NodePort
  selector:
    app: my-web-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080 
